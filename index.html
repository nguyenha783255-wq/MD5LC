<html lang="vi">
<head>
<meta charset="UTF-8">

<title>LC79 AI Predictor — Siêu Việt V2</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
  --gold:#FF9500; --gold-bright:#FFB800; --gold-dim:#B36A00;
  --gold-glow:rgba(255,149,0,0.55); --gold-glow-soft:rgba(255,149,0,0.25);
  --card-bg:rgba(22,14,2,0.92);
  --tai:#00E676; --xiu:#FF1744;
  --font-num:'Orbitron',monospace; --font-main:'Montserrat',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000; background-image:radial-gradient(circle at center,#1e1000 0%,#000 100%);
  font-family:var(--font-main); height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center; position:relative;
}
#bg-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}

.app-card{
  position:relative; z-index:10; width:340px; height:700px;
  background:var(--card-bg); border:2px solid rgba(255,149,0,0.65);
  border-radius:25px; display:flex; flex-direction:column;
  box-shadow:0 0 70px var(--gold-glow-soft), 0 0 30px rgba(255,149,0,0.2);
  overflow:hidden; backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
}
.header{
  padding:14px 10px 10px; text-align:center;
  border-bottom:1px solid rgba(255,149,0,0.22);
  background:linear-gradient(to bottom,rgba(28,16,0,0.85),transparent);
}
.header h2{
  font-family:var(--font-num); color:var(--gold-bright); font-size:14.5px;
  letter-spacing:2.5px; text-transform:uppercase;
  text-shadow:0 0 20px var(--gold-glow), 0 0 6px rgba(255,184,0,0.9); font-weight:900;
}
.header .sub{
  font-size:7.5px; color:#a3741f; letter-spacing:1.6px; margin-top:2px;
  font-weight:700; text-transform:uppercase;
}
.header .regime{
  display:inline-block; margin-top:5px;
  padding:3px 10px; border-radius:999px;
  font-size:8.5px; font-weight:900; letter-spacing:1px;
  background:rgba(255,149,0,0.12); border:1px solid rgba(255,149,0,0.4);
  color:#ffcb47;
}
.header .regime.trending{background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.5);color:#6ee7b7}
.header .regime.choppy{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.5);color:#fca5a5}
.header .regime.transition{background:rgba(168,85,247,0.15);border-color:rgba(168,85,247,0.5);color:#d8b4fe}

.prediction-section{padding:12px 0 4px; display:flex; flex-direction:column; align-items:center}
.ring-container{
  width:134px; height:134px; position:relative;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.65); border-radius:50%;
  box-shadow:0 0 30px var(--gold-glow-soft),inset 0 0 20px rgba(0,0,0,0.9);
  border:1px solid rgba(255,149,0,0.18);
}
.ring-loader{
  position:absolute; top:-2px; left:-2px; right:-2px; bottom:-2px;
  border-radius:50%; border:3px solid transparent;
  border-top-color:var(--gold); border-right-color:rgba(255,149,0,0.3);
  animation:spin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
  box-shadow:0 0 20px var(--gold-glow-soft);
}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.result-display{
  font-family:var(--font-num); font-size:38px; font-weight:900;
  z-index:2; transition:all 0.4s; letter-spacing:1px;
}
.text-tai{color:var(--tai); text-shadow:0 0 25px rgba(0,230,118,0.65)}
.text-xiu{color:var(--xiu); text-shadow:0 0 25px rgba(255,23,68,0.65)}
.text-wait{color:#666; font-size:20px !important; letter-spacing:1px}

.info-bar{
  margin-top:12px; width:92%; padding:7px 12px;
  display:flex; justify-content:space-between; align-items:center;
  background:rgba(28,16,0,0.45); border-radius:12px;
  color:#999; font-size:11px; font-weight:700;
  border:1px solid rgba(255,149,0,0.25);
}
.active-session{color:#fff; font-family:var(--font-num); font-size:12px; letter-spacing:1px}
.clock-txt{color:var(--gold-bright); font-family:var(--font-num); font-size:11px; text-shadow:0 0 8px var(--gold-glow)}

.pattern-bar{
  margin-top:6px; width:92%; padding:8px 11px;
  display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(90deg,rgba(255,149,0,0.1),rgba(255,23,68,0.05));
  border-radius:11px; border:1px solid rgba(255,149,0,0.38);
  gap:8px; position:relative; overflow:hidden;
}
.pattern-bar::before{
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,184,0,0.15),transparent);
  animation:slide-bar 3s linear infinite;
}
@keyframes slide-bar{0%{left:-100%}100%{left:100%}}
.pattern-name{
  font-size:10.5px; font-weight:900; color:var(--gold-bright);
  letter-spacing:0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  flex:1; text-shadow:0 0 8px var(--gold-glow-soft);
}
.pattern-end{
  font-size:9px; font-weight:800; color:#ffcb47;
  background:rgba(255,23,68,0.15); border:1px solid rgba(255,184,0,0.45);
  padding:3px 8px; border-radius:999px; letter-spacing:0.5px; white-space:nowrap;
}
.pattern-end.urgent{
  background:rgba(255,23,68,0.35); color:#fff;
  animation:urgent-blink 0.9s infinite; box-shadow:0 0 12px rgba(255,23,68,0.6);
}
@keyframes urgent-blink{0%,100%{opacity:1}50%{opacity:0.55}}

.metric-wrap{padding:0 20px; margin-top:9px}
.metric-row{
  display:flex; justify-content:space-between; align-items:center;
  font-size:9px; color:var(--gold-bright); font-weight:800;
  letter-spacing:0.5px; margin-bottom:4px; text-transform:uppercase;
  text-shadow:0 0 5px var(--gold-glow-soft);
}
.metric-row .val{color:#fff; font-family:var(--font-num); font-size:10px}
.progress-bg{
  height:5px; background:#111; border-radius:10px; overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.8);
  border:1px solid rgba(255,255,255,0.05);
}
.progress-fill{
  height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-bright));
  box-shadow:0 0 15px var(--gold-glow); transition:width 0.5s ease; border-radius:10px;
}
.progress-fill.green{background:linear-gradient(90deg,#059669,#10b981,#34d399); box-shadow:0 0 15px rgba(16,185,129,0.6)}
.progress-fill.purple{background:linear-gradient(90deg,#7c3aed,#a855f7,#d8b4fe); box-shadow:0 0 15px rgba(168,85,247,0.6)}

.history-section{
  flex:1; display:flex; flex-direction:column;
  background:rgba(0,0,0,0.4);
  border-top:1px solid rgba(255,149,0,0.22); min-height:0; margin-top:10px;
}
.hist-head{
  display:grid; grid-template-columns:1fr 0.9fr 0.9fr 1.2fr;
  background:rgba(255,149,0,0.1); padding:8px 0;
  font-size:8.5px; color:var(--gold-bright); font-weight:800; text-align:center;
  text-shadow:0 0 5px var(--gold-glow-soft); letter-spacing:0.5px;
  border-bottom:1px solid rgba(255,149,0,0.15);
}
.hist-body{flex:1; overflow-y:auto; padding:0 5px}
.hist-body::-webkit-scrollbar{width:3px}
.hist-body::-webkit-scrollbar-thumb{background:var(--gold-dim); border-radius:2px}
.hist-row{
  display:grid; grid-template-columns:1fr 0.9fr 0.9fr 1.2fr;
  padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.045);
  color:#ddd; font-size:10.5px; font-weight:700;
  align-items:center; text-align:center; transition:background 0.2s;
}
.hist-row:hover{background:rgba(255,149,0,0.05)}
.hist-row.pending{
  background:rgba(255,149,0,0.08);
  border-bottom:1px solid rgba(255,149,0,0.28);
  animation:pending-blink 2s ease-in-out infinite;
}
@keyframes pending-blink{0%,100%{opacity:1}50%{opacity:0.8}}
.badge{padding:3px 6px; border-radius:4px; font-size:9px; min-width:36px; font-weight:800; display:inline-block}
.b-tai{background:rgba(0,255,42,0.15); color:var(--tai); border:1px solid rgba(0,255,42,0.5)}
.b-xiu{background:rgba(255,23,68,0.15); color:var(--xiu); border:1px solid rgba(255,23,68,0.5)}

div:where(.swal2-container) div:where(.swal2-popup){
  border:1px solid rgba(255,149,0,0.45) !important; background:#0a0600 !important;
  box-shadow:0 0 40px rgba(255,149,0,0.3) !important; border-radius:18px !important;
}
div:where(.swal2-icon).swal2-success{border-color:var(--gold) !important; color:var(--gold) !important}
div:where(.swal2-icon).swal2-success [class^='swal2-success-line']{background-color:var(--gold) !important}
div:where(.swal2-icon).swal2-success .swal2-success-ring{border:4px solid rgba(255,149,0,0.25) !important}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="app-card">
  <div class="header">
    <h2>LC79 · SIÊU VIỆT V2</h2>
    <div class="sub">DEEP PATTERN · STRICT MATCH · REGIME · TRAP</div>
    <div class="regime" id="regime-badge">ĐANG PHÂN TÍCH</div>
  </div>

  <div class="prediction-section">
    <div class="ring-container">
      <div class="ring-loader"></div>
      <div id="main-result" class="result-display text-wait">LOADING</div>
    </div>
    <div class="info-bar">
      <span>PHIÊN: <span id="ss-now" class="active-session">---</span></span>
      <span id="clock-now" class="clock-txt">00:00:00</span>
    </div>
    <div class="pattern-bar">
      <span class="pattern-name" id="pattern-name">🎯 Đang nhận diện cầu...</span>
      <span class="pattern-end" id="pattern-end">— p</span>
    </div>
  </div>

  <div class="metric-wrap">
    <div class="metric-row"><span>ĐỘ TIN CẬY AI</span><span class="val" id="conf-txt">---</span></div>
    <div class="progress-bg"><div id="conf-bar" class="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="metric-wrap">
    <div class="metric-row"><span>SỨC MẠNH CẦU</span><span class="val" id="strength-txt">---</span></div>
    <div class="progress-bg"><div id="strength-bar" class="progress-fill green" style="width:0%"></div></div>
  </div>
  <div class="metric-wrap">
    <div class="metric-row"><span>REGIME CONF</span><span class="val" id="regime-txt">---</span></div>
    <div class="progress-bg"><div id="regime-bar" class="progress-fill purple" style="width:0%"></div></div>
  </div>

  <div class="history-section">
    <div class="hist-head">
      <div>PHIÊN</div><div>DỰ ĐOÁN</div><div>KẾT QUẢ</div><div>ĐÁNH GIÁ</div>
    </div>
    <div class="hist-body" id="history-list"></div>
  </div>
</div>

<script>
/* ====================================================================
 * LC79 SIÊU VIỆT V2 — Kiến trúc 5 tầng + STRICT PATTERN MATCHING
 * Cải tiến V2:
 *  - Min matched >= 1.6 × cycleLen (chống nhầm cầu ngắn)
 *  - Specificity score ưu tiên cycleLen dài (2-2 > 1-2)
 *  - Không dùng dynamic weights — fixed weights
 *  - Cross-validation pattern ambiguity
 *  - Tăng tầm nhìn lên 100 phiên
 * ==================================================================*/

/* ---------- STATISTICS CORE ---------- */
const Stat = {
  mean: a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : 0,
  variance: a => { if(a.length<2) return 0; const m=Stat.mean(a); return a.reduce((s,v)=>s+(v-m)**2,0)/a.length; },
  std: a => Math.sqrt(Stat.variance(a)),
  skewness: a => { const n=a.length; if(n<3) return 0; const m=Stat.mean(a), s=Stat.std(a); if(s===0) return 0;
    return a.reduce((sum,v)=>sum+((v-m)/s)**3,0)*n/((n-1)*(n-2)); },
  kurtosis: a => { const n=a.length; if(n<4) return 0; const m=Stat.mean(a), s=Stat.std(a); if(s===0) return 0;
    return a.reduce((sum,v)=>sum+((v-m)/s)**4,0)*(n*(n+1))/((n-1)*(n-2)*(n-3)) - 3*(n-1)**2/((n-2)*(n-3)); },
  entropy: seq => {
    if (!seq.length) return 0;
    const c = {Tài:0, Xỉu:0};
    seq.forEach(v => c[v]++);
    let H = 0; const n = seq.length;
    for (const k in c) { if (!c[k]) continue; const p = c[k]/n; H -= p * Math.log2(p); }
    return H;
  },
  autocorr: (seq, lag=1) => {
    const n = seq.length; if (n < lag + 3) return 0;
    const p = seq.filter(v=>v==='Tài').length / n;
    const varP = p * (1 - p); if (varP === 0) return 0;
    let sum = 0, cnt = 0;
    for (let i = 0; i < n - lag; i++) {
      const a = seq[i]==='Tài'?1:0, b = seq[i+lag]==='Tài'?1:0;
      sum += (a - p) * (b - p); cnt++;
    }
    return (sum / cnt) / varP;
  },
  longestRun: (seq) => {
    if (!seq.length) return 0;
    let max = 1, cur = 1;
    for (let i = 1; i < seq.length; i++) {
      if (seq[i] === seq[i-1]) { cur++; if (cur > max) max = cur; }
      else cur = 1;
    }
    return max;
  },
  switchRate: (seq, window=10) => {
    const w = seq.slice(-window); if (w.length < 2) return 0;
    let s = 0;
    for (let i = 1; i < w.length; i++) if (w[i] !== w[i-1]) s++;
    return s / (w.length - 1);
  },
};

/* ====================================================================
 * TẦNG 1: FEATURE EXTRACTION — 100 PHIÊN
 * ==================================================================*/
const Features = {
  extract(history) {
    const recent = history.slice(-100);
    const seq = recent.map(h=>h.result);
    const points = recent.map(h=>h.totalScore||0);
    const n = seq.length;

    const short = seq.slice(-10), mid = seq.slice(-30), long = seq.slice(-60);

    const pTai = {
      short: short.filter(v=>v==='Tài').length / (short.length||1),
      mid: mid.filter(v=>v==='Tài').length / (mid.length||1),
      long: long.filter(v=>v==='Tài').length / (long.length||1),
    };

    return {
      seq, points, n,
      entropy: Stat.entropy(seq),
      entropyShort: Stat.entropy(short),
      entropyMid: Stat.entropy(mid),
      autocorr1: Stat.autocorr(seq, 1),
      autocorr2: Stat.autocorr(seq, 2),
      autocorr3: Stat.autocorr(seq, 3),
      longestRun: Stat.longestRun(seq),
      switchRate10: Stat.switchRate(seq, 10),
      switchRate20: Stat.switchRate(seq, 20),
      switchRate50: Stat.switchRate(seq, 50),
      pTaiShort: pTai.short, pTaiMid: pTai.mid, pTaiLong: pTai.long,
      pointsMean: Stat.mean(points),
      pointsStd: Stat.std(points),
      pointsSkew: Stat.skewness(points),
      pointsKurt: Stat.kurtosis(points),
      pointsMomentum: Stat.mean(points.slice(-3)) - Stat.mean(points.slice(-6,-3)),
    };
  }
};

/* ====================================================================
 * TẦNG 2: PATTERN RECOGNITION V4 — STRICT & SPECIFIC
 *  FIX: Cầu 2-2 không bị nhầm thành 1-2
 * ==================================================================*/
const PatternEngine = {
  templates: [
    // 2-block
    {blocks:[1,1],name:'Cầu 1-1',family:'Xen kẽ'},
    {blocks:[2,1],name:'Cầu 2-1',family:'Bệt đối'},
    {blocks:[1,2],name:'Cầu 1-2',family:'Bệt đối'},
    {blocks:[3,1],name:'Cầu 3-1',family:'Bệt đối'},
    {blocks:[1,3],name:'Cầu 1-3',family:'Bệt đối'},
    {blocks:[2,2],name:'Cầu 2-2',family:'Đối xứng'},
    {blocks:[3,2],name:'Cầu 3-2',family:'Bệt đối'},
    {blocks:[2,3],name:'Cầu 2-3',family:'Bệt đối'},
    {blocks:[3,3],name:'Cầu 3-3',family:'Đối xứng'},
    {blocks:[4,1],name:'Cầu 4-1',family:'Bệt đối'},
    {blocks:[1,4],name:'Cầu 1-4',family:'Bệt đối'},
    {blocks:[4,2],name:'Cầu 4-2',family:'Bệt đối'},
    {blocks:[2,4],name:'Cầu 2-4',family:'Bệt đối'},
    {blocks:[4,3],name:'Cầu 4-3',family:'Bệt đối'},
    {blocks:[3,4],name:'Cầu 3-4',family:'Bệt đối'},
    {blocks:[4,4],name:'Cầu 4-4',family:'Đối xứng'},
    {blocks:[5,1],name:'Cầu 5-1',family:'Bệt đối'},
    {blocks:[1,5],name:'Cầu 1-5',family:'Bệt đối'},
    {blocks:[5,2],name:'Cầu 5-2',family:'Bệt đối'},
    {blocks:[2,5],name:'Cầu 2-5',family:'Bệt đối'},
    // 3-block
    {blocks:[1,2,1],name:'Cầu 1-2-1',family:'Tay 3'},
    {blocks:[2,1,2],name:'Cầu 2-1-2',family:'Tay 3'},
    {blocks:[2,1,1],name:'Cầu 2-1-1',family:'Tay 3'},
    {blocks:[1,1,2],name:'Cầu 1-1-2',family:'Tay 3'},
    {blocks:[1,2,2],name:'Cầu 1-2-2',family:'Tay 3'},
    {blocks:[2,2,1],name:'Cầu 2-2-1',family:'Tay 3'},
    {blocks:[3,1,1],name:'Cầu 3-1-1',family:'Tay 3'},
    {blocks:[1,1,3],name:'Cầu 1-1-3',family:'Tay 3'},
    {blocks:[1,3,1],name:'Cầu 1-3-1',family:'Tay 3'},
    {blocks:[3,1,2],name:'Cầu 3-1-2',family:'Tay 3'},
    {blocks:[2,3,1],name:'Cầu 2-3-1',family:'Tay 3'},
    {blocks:[1,3,2],name:'Cầu 1-3-2',family:'Tay 3'},
    {blocks:[2,2,2],name:'Cầu 2-2-2',family:'Đối xứng'},
    // 4-block
    {blocks:[1,1,1,2],name:'Cầu 1-1-1-2',family:'Tay 4'},
    {blocks:[1,1,2,1],name:'Cầu 1-1-2-1',family:'Tay 4'},
    {blocks:[1,2,1,1],name:'Cầu 1-2-1-1',family:'Tay 4'},
    {blocks:[2,1,1,1],name:'Cầu 2-1-1-1',family:'Tay 4'},
    {blocks:[2,1,2,1],name:'Cầu 2-1-2-1',family:'Tay 4'},
    {blocks:[1,2,1,2],name:'Cầu 1-2-1-2',family:'Tay 4'},
    {blocks:[2,2,1,1],name:'Cầu 2-2-1-1',family:'Tay 4'},
    {blocks:[1,1,2,2],name:'Cầu 1-1-2-2',family:'Tay 4'},
    // Tăng/giảm
    {blocks:[1,2,3],name:'Cầu 1-2-3',family:'Tăng dần'},
    {blocks:[3,2,1],name:'Cầu 3-2-1',family:'Giảm dần'},
    {blocks:[2,3,4],name:'Cầu 2-3-4',family:'Tăng dần'},
    {blocks:[4,3,2],name:'Cầu 4-3-2',family:'Giảm dần'},
    {blocks:[1,2,3,4],name:'Cầu 1-2-3-4',family:'Tăng dần'},
    {blocks:[4,3,2,1],name:'Cầu 4-3-2-1',family:'Giảm dần'},
  ],

  /* ---- DEEP CYCLE DETECTION với STRICT MATCH ---- */
  detectCycle(seq, blocks) {
    const cycleLen = blocks.reduce((a,b)=>a+b,0);
    /* FIX QUAN TRỌNG: min matched >= 1.6 chu kỳ + >= cycleLen + 3
       → 2-2 cần >= 7 match, 1-2 cần >= 5 match
       → Chống nhầm 2-2 thành 1-2 khi match ngắn */
    const minMatched = Math.max(cycleLen + 3, Math.ceil(cycleLen * 1.6));
    if (seq.length < minMatched) return null;

    let best = null;
    // Chỉ xét S trong 50 phiên gần đây (không quá xa)
    const startLimit = Math.max(0, seq.length - 50);
    for (let S = startLimit; S <= seq.length - minMatched; S++) {
      const startResult = seq[S];
      let matched = 0, ok = true;
      for (let i = S; i < seq.length; i++) {
        const pos = (i - S) % cycleLen;
        let cum = 0, blockIdx = 0;
        for (let b = 0; b < blocks.length; b++) {
          if (pos < cum + blocks[b]) { blockIdx = b; break; }
          cum += blocks[b];
        }
        const expected = (blockIdx % 2 === 0) ? startResult : (startResult==='Tài'?'Xỉu':'Tài');
        if (seq[i] !== expected) { ok = false; break; }
        matched++;
      }
      if (!ok || matched < minMatched) continue;

      const cyclesFloat = matched / cycleLen;
      /* Yêu cầu >= 1.5 chu kỳ để tránh match nửa vời */
      if (cyclesFloat < 1.5) continue;

      const itemsInCycle = matched % cycleLen;
      const cyclesCompleted = Math.floor(matched / cycleLen);
      const itemsUntilCycleEnd = cycleLen - itemsInCycle;
      const nextPos = itemsInCycle;
      let cum = 0, blockIdx = 0;
      for (let b = 0; b < blocks.length; b++) {
        if (nextPos < cum + blocks[b]) { blockIdx = b; break; }
        cum += blocks[b];
      }
      const predictedNext = (blockIdx % 2 === 0) ? startResult : (startResult==='Tài'?'Xỉu':'Tài');

      const maturity = Math.min(1, cyclesCompleted / 5);
      const isAtBoundary = itemsInCycle === 0 && cyclesCompleted >= 1;
      const isNearingEnd = itemsUntilCycleEnd <= 1;

      let urgency = 0;
      if (cyclesCompleted >= 6) urgency = 0.70;
      else if (cyclesCompleted >= 5) urgency = 0.58;
      else if (cyclesCompleted >= 4) urgency = 0.45;
      else if (cyclesCompleted >= 3) urgency = 0.30;
      else if (cyclesCompleted >= 2) urgency = 0.16;
      else urgency = 0.05;

      let willBreak = false;
      let finalPred = predictedNext;
      if (isAtBoundary && cyclesCompleted >= 3) {
        finalPred = startResult==='Tài'?'Xỉu':'Tài';
        willBreak = true;
      }

      let confidence = 0.55 + Math.min(0.30, (cyclesFloat - 1.5) * 0.08) + urgency * 0.28;
      confidence = Math.min(0.96, confidence);

      /* ===== SCORE: SPECIFICITY WEIGHTING =====
       * matched * 100: khớp nhiều = quan trọng
       * cycleLen * 35: cầu dài = CỤ THỂ HƠN (giải quyết 2-2 vs 1-2)
       * S: càng gần đây càng tốt
       * urgency * 180: cầu sắp bẻ = boost
       */
      const score = matched * 100 + cycleLen * 35 + S + urgency * 180;

      const candidate = {
        type:'cycle', blocks, cycleLen, startIdx:S, startResult,
        matched, predictedNext:finalPred, blockIdx,
        cyclesCompleted, itemsInCycle, itemsUntilCycleEnd,
        predictedBreakIn: willBreak ? 1 : Math.max(1, itemsUntilCycleEnd + cycleLen * (cyclesCompleted >= 4 ? 1 : 2)),
        willBreak, urgency, maturity, confidence,
        endsIn: willBreak ? 1 : itemsUntilCycleEnd,
        isUrgent: isNearingEnd || willBreak,
        cyclesFloat: cyclesFloat.toFixed(2),
        score,
      };

      if (!best || score > best.score) best = candidate;
    }
    return best;
  },

  detectStreak(seq) {
    if (seq.length < 3) return null;
    const last = seq[seq.length-1];
    let count = 1;
    for (let i = seq.length-2; i >= 0; i--) { if (seq[i]===last) count++; else break; }
    if (count < 3) return null;
    let breakProb;
    if (count >= 10) breakProb = 0.95;
    else if (count >= 8) breakProb = 0.88;
    else if (count >= 7) breakProb = 0.78;
    else if (count >= 6) breakProb = 0.65;
    else if (count >= 5) breakProb = 0.50;
    else if (count >= 4) breakProb = 0.38;
    else breakProb = 0.25;
    const predictedNext = breakProb > 0.5 ? (last==='Tài'?'Xỉu':'Tài') : last;
    return {
      type:'streak', name:`Bệt ${last} (${count})`, family:'Bệt',
      streakLength:count, streakResult:last, predictedNext, breakProb,
      predictedBreakIn: count<4?2:count<6?1:1, endsIn: count<4?2:1,
      willBreak: breakProb>0.5, isUrgent: count>=6,
      confidence: Math.max(breakProb, 1-breakProb),
      urgency: Math.min(0.60, (count-3)*0.10),
      maturity: Math.min(1, count/10),
      score: count * 250 + (breakProb>0.5?200:0),
    };
  },

  detectKep(seq) {
    if (seq.length < 4) return null;
    const n = seq.length;
    const a=seq[n-4], b=seq[n-3], c=seq[n-2], d=seq[n-1];
    if (a===d && b===c && a!==b) {
      return {
        type:'cycle', name:`Kẹp ${a}-${b}-${b}-${a}`, family:'Kẹp',
        blocks:[1,2,1], cycleLen:4, matched:4, startResult:a,
        predictedNext: d==='Tài'?'Xỉu':'Tài',
        cyclesCompleted:1, itemsUntilCycleEnd:0,
        predictedBreakIn:1, endsIn:1, willBreak:true, isUrgent:true,
        urgency:0.28, maturity:0.2, confidence:0.78,
        score: 4 * 100 + 4 * 35 + (n-4) + 0.28 * 180,
      };
    }
    return null;
  },

  detectNested(seq) {
    if (seq.length < 14) return null;
    const last7 = seq.slice(-7), prev7 = seq.slice(-14, -7);
    const swL = last7.slice(1).reduce((c,v,i)=>c+(v!==last7[i]?1:0),0);
    const swP = prev7.slice(1).reduce((c,v,i)=>c+(v!==prev7[i]?1:0),0);
    if (Math.abs(swL - swP) >= 3) {
      const last = seq[seq.length-1];
      return {
        type:'transition', name:'Chuyển nhịp', family:'Transition',
        predictedNext: last==='Tài'?'Xỉu':'Tài',
        confidence:0.62, urgency:0.2, maturity:0.5,
        predictedBreakIn:2, endsIn:2, willBreak:false, isUrgent:false,
        score: 2 * 100 + 8 * 35,
      };
    }
    return null;
  },

  detect(seq) {
    const matches = [];
    for (const tpl of this.templates) {
      const m = this.detectCycle(seq, tpl.blocks);
      if (m) matches.push({...m, name:tpl.name, family:tpl.family});
    }
    const st = this.detectStreak(seq); if (st) matches.push(st);
    const kp = this.detectKep(seq); if (kp) matches.push(kp);
    const nst = this.detectNested(seq); if (nst) matches.push(nst);

    /* Sort by score (specificity + matched + urgency) */
    matches.sort((a,b)=>(b.score||0)-(a.score||0));

    /* Dedupe by name, giữ cái score cao nhất */
    const seen = new Set();
    const unique = [];
    for (const m of matches) {
      if (seen.has(m.name)) continue;
      seen.add(m.name); unique.push(m);
    }
    return unique;
  },

  /* ---- PREDICT với CROSS-VALIDATION ---- */
  predict(seq) {
    const patterns = this.detect(seq);
    if (!patterns.length) return {prediction:null, confidence:0, patterns:[], active:null, urgency:0, strength:0};

    let taiW=0, xiuW=0, totalW=0, maxUrg=0;
    for (const p of patterns) {
      let w;
      if (p.type === 'streak') w = p.streakLength * 2;
      else if (p.type === 'transition') w = 2;
      else w = p.matched * 1.2 + (p.cyclesCompleted||1) * 3 + p.cycleLen * 0.5;

      w *= (1 + (p.urgency||0) * 2.5);
      if (p.isUrgent) w *= 1.4;
      if (p.willBreak) w *= 1.6;

      const sc = w * (p.confidence||0.5);
      if (p.predictedNext==='Tài') taiW+=sc;
      else if (p.predictedNext==='Xỉu') xiuW+=sc;
      totalW += sc;
      if ((p.urgency||0) > maxUrg) maxUrg = p.urgency;
    }

    const prediction = taiW >= xiuW ? 'Tài':'Xỉu';
    const confidence = totalW>0 ? Math.max(taiW,xiuW)/(taiW+xiuW) : 0.5;
    const active = patterns[0];

    /* Ép buộc bẻ cầu khi cầu active chỉ ra */
    let finalPrediction = prediction;
    if (active && active.willBreak && (active.urgency||0) >= 0.18) {
      finalPrediction = active.predictedNext;
    }

    /* Sức mạnh cầu: matched / (cycleLen*5) capped */
    let strength = 0;
    if (active) {
      if (active.type === 'streak') strength = Math.min(1, active.streakLength / 10);
      else if (active.cycleLen) strength = Math.min(1, active.matched / (active.cycleLen * 4));
    }

    return {
      prediction: finalPrediction,
      confidence: Math.min(0.97, confidence + maxUrg*0.15),
      patterns, active, urgency:maxUrg, strength,
      rawPrediction: prediction,
    };
  }
};

/* ====================================================================
 * TẦNG 3: REGIME DETECTION
 * ==================================================================*/
const RegimeDetector = {
  detect(features) {
    const { entropyShort, switchRate10, switchRate20, longestRun, autocorr1 } = features;
    let trending = 0, choppy = 0;

    if (entropyShort < 0.7) trending += 0.35;
    if (switchRate10 < 0.4) trending += 0.30;
    if (switchRate20 < 0.45) trending += 0.20;
    if (autocorr1 > 0.15) trending += 0.25;
    if (longestRun >= 4) trending += 0.20;

    if (entropyShort > 0.9) choppy += 0.40;
    if (switchRate10 > 0.6) choppy += 0.35;
    if (switchRate20 > 0.55) choppy += 0.25;
    if (autocorr1 < -0.1) choppy += 0.25;

    const transition = Math.max(0, 1 - Math.abs(trending - choppy));
    const total = trending + choppy + transition || 1;
    trending /= total; choppy /= total;
    const transitionN = 1 - trending - choppy;

    let regime = 'transition', conf = transitionN;
    if (trending > choppy && trending > transitionN) { regime='trending'; conf=trending; }
    else if (choppy > trending && choppy > transitionN) { regime='choppy'; conf=choppy; }

    return {
      regime,
      confidence: conf,
      scores: {trending, choppy, transition: transitionN},
      label: regime==='trending' ? '📈 XU HƯỚNG' :
             regime==='choppy' ? '🌊 HỖN LOẠN' : '🔄 CHUYỂN TIẾP',
    };
  }
};

/* ====================================================================
 * TẦNG 4: TRAP DETECTOR + CALIBRATION
 * ==================================================================*/
const TrapDetector = {
  detect(features, patternRes) {
    const { entropy, switchRate10, pTaiShort, pTaiMid, pointsSkew } = features;
    const traps = [];
    if (entropy > 0.95 && patternRes.active && patternRes.active.confidence > 0.85)
      traps.push({type:'HIGH_ENTROPY_CLEAR_PATTERN', weight:0.3});
    if (Math.abs(pTaiShort - pTaiMid) > 0.4)
      traps.push({type:'SHORT_MID_DIVERGENCE', weight:0.25});
    if (Math.abs(pointsSkew) > 1.5)
      traps.push({type:'POINT_SKEW_ANOMALY', weight:0.2});
    if (switchRate10 > 0.75)
      traps.push({type:'TOO_MUCH_SWITCH', weight:0.35});

    const trapScore = Math.min(1, traps.reduce((s,t)=>s+t.weight, 0));
    return { isTrap: trapScore > 0.5, trapScore, traps };
  }
};

/* ====================================================================
 * CÁC THUẬT TOÁN TRUYỀN THỐNG (giữ nguyên từ bản trước, fixed weights)
 * ==================================================================*/
const Mrtinh = {
  detectStreakAndBreak(history){
    if(!history || !history.length) return {streak:0,currentResult:null,breakProb:0};
    let streak=1;
    const cur=history[history.length-1].result;
    for(let i=history.length-2;i>=0;i--){ if(history[i].result===cur) streak++; else break; }
    const last15=history.slice(-15).map(h=>h.result);
    if(!last15.length) return {streak,currentResult:cur,breakProb:0};
    const switches=last15.slice(1).reduce((c,cu,i)=>c+(cu!==last15[i]?1:0),0);
    const tC=last15.filter(r=>r==='Tài').length, xC=last15.filter(r=>r==='Xỉu').length;
    const imb=Math.abs(tC-xC)/last15.length;
    let bp=0;
    if(streak>=6) bp=Math.min(0.8+switches/15+imb*0.3,0.95);
    else if(streak>=4) bp=Math.min(0.5+switches/12+imb*0.25,0.9);
    else if(streak>=2&&switches>=5) bp=0.45;
    else if(streak===1&&switches>=6) bp=0.3;
    return {streak,currentResult:cur,breakProb:bp};
  },
  smartBridgeBreak(history){
    if(!history || history.length<5) return {prediction:0,breakProb:0,reason:'Thiếu data'};
    const {streak,currentResult,breakProb}=Mrtinh.detectStreakAndBreak(history);
    const last20=history.slice(-20).map(h=>h.result);
    const scores=history.slice(-20).map(h=>h.totalScore||0);
    let bp=breakProb, reason='';
    const avg=Stat.mean(scores);
    const dev=scores.reduce((s,v)=>s+Math.abs(v-avg),0)/(scores.length||1);
    const last5=last20.slice(-5);
    const pc={};
    for(let i=0;i<=last20.length-2;i++){ const p=last20.slice(i,i+2).join(','); pc[p]=(pc[p]||0)+1; }
    const mc=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0];
    const stable=mc && mc[1]>=3;
    if(streak>=3 && dev<2 && !stable){ bp=Math.max(bp-0.25,0.1); reason=`[Theo] Chuỗi ${streak}`; }
    else if(streak>=6){ bp=Math.min(bp+0.3,0.95); reason=`[Bẻ] Chuỗi dài`; }
    else if(streak>=3 && dev>3.5){ bp=Math.min(bp+0.25,0.9); reason=`[Bẻ] Biến động`; }
    else if(stable && last5.every(r=>r===currentResult)){ bp=Math.min(bp+0.2,0.85); reason=`[Bẻ] Mẫu lặp`; }
    else { bp=Math.max(bp-0.2,0.1); reason=`[Theo] Không có bẻ`; }
    const prediction = bp>0.5 ? (currentResult==='Tài'?2:1) : (currentResult==='Tài'?1:2);
    return {prediction,breakProb:bp,reason};
  },
  trendAndProb(history){
    if(!history || history.length<3) return 0;
    const {streak,currentResult,breakProb}=Mrtinh.detectStreakAndBreak(history);
    if(streak>=3){ if(breakProb>0.6) return currentResult==='Tài'?2:1; return currentResult==='Tài'?1:2; }
    const last15=history.slice(-15).map(h=>h.result);
    if(!last15.length) return 0;
    const w=last15.map((_,i)=>Math.pow(1.3,i));
    const tw=w.reduce((s,ww,i)=>s+(last15[i]==='Tài'?ww:0),0);
    const xw=w.reduce((s,ww,i)=>s+(last15[i]==='Xỉu'?ww:0),0);
    const total=tw+xw;
    const l10=last15.slice(-10);
    const pats=[];
    for(let i=0;i<=l10.length-4;i++) pats.push(l10.slice(i,i+4).join(','));
    const pcc=pats.reduce((a,p)=>{a[p]=(a[p]||0)+1;return a;},{});
    const mcx=Object.entries(pcc).sort((a,b)=>b[1]-a[1])[0];
    if(mcx && mcx[1]>=3){ const pt=mcx[0].split(','); return pt[pt.length-1]!==l10[l10.length-1]?1:2; }
    else if(total>0 && Math.abs(tw-xw)/total>=0.25) return tw>xw?1:2;
    return last15[last15.length-1]==='Xỉu'?1:2;
  },
  shortPattern(history){
    if(!history || history.length<3) return 0;
    const {streak,currentResult,breakProb}=Mrtinh.detectStreakAndBreak(history);
    if(streak>=2){ if(breakProb>0.6) return currentResult==='Tài'?2:1; return currentResult==='Tài'?1:2; }
    const l8=history.slice(-8).map(h=>h.result);
    if(!l8.length) return 0;
    const pats=[];
    for(let i=0;i<=l8.length-2;i++) pats.push(l8.slice(i,i+2).join(','));
    const pcc=pats.reduce((a,p)=>{a[p]=(a[p]||0)+1;return a;},{});
    const mcx=Object.entries(pcc).sort((a,b)=>b[1]-a[1])[0];
    if(mcx && mcx[1]>=2){ const pt=mcx[0].split(','); return pt[pt.length-1]!==l8[l8.length-1]?1:2; }
    return l8[l8.length-1]==='Xỉu'?1:2;
  },
  meanDeviation(history){
    if(!history || history.length<3) return 0;
    const {streak,currentResult,breakProb}=Mrtinh.detectStreakAndBreak(history);
    if(streak>=2){ if(breakProb>0.6) return currentResult==='Tài'?2:1; return currentResult==='Tài'?1:2; }
    const l12=history.slice(-12).map(h=>h.result);
    if(!l12.length) return 0;
    const tc=l12.filter(r=>r==='Tài').length, xc=l12.length-tc;
    const dev=Math.abs(tc-xc)/l12.length;
    if(dev<0.2) return l12[l12.length-1]==='Xỉu'?1:2;
    return xc>tc?1:2;
  },
  recentSwitch(history){
    if(!history || history.length<3) return 0;
    const {streak,currentResult,breakProb}=Mrtinh.detectStreakAndBreak(history);
    if(streak>=2){ if(breakProb>0.6) return currentResult==='Tài'?2:1; return currentResult==='Tài'?1:2; }
    const l10=history.slice(-10).map(h=>h.result);
    if(!l10.length) return 0;
    return l10[l10.length-1]==='Xỉu'?1:2;
  },
  isBadPattern(history){
    const l15=history.slice(-15).map(h=>h.result);
    if(!l15.length) return false;
    const sw=l15.slice(1).reduce((c,cu,i)=>c+(cu!==l15[i]?1:0),0);
    const {streak}=Mrtinh.detectStreakAndBreak(history);
    return sw>=6 || streak>=7;
  },
  aiHtddLogic(history){
    if(!history || history.length<3) return {prediction:Math.random()<0.5?'Tài':'Xỉu',reason:'[AI] Data ngắn'};
    const rh=history.slice(-5).map(h=>h.result);
    const rs=history.slice(-5).map(h=>h.totalScore||0);
    const tc=rh.filter(r=>r==='Tài').length, xc=rh.filter(r=>r==='Xỉu').length;
    const {streak,currentResult}=Mrtinh.detectStreakAndBreak(history);
    if(streak>=2 && streak<=4) return {prediction:currentResult,reason:`[Theo] Chuỗi ${streak}`};
    if(history.length>=3){
      const l3=history.slice(-3).map(h=>h.result).join(',');
      if(l3==='Tài,Xỉu,Tài') return {prediction:'Xỉu',reason:'[Bẻ] 1T1X'};
      if(l3==='Xỉu,Tài,Xỉu') return {prediction:'Tài',reason:'[Bẻ] 1X1T'};
    }
    if(history.length>=4){
      const l4=history.slice(-4).map(h=>h.result).join(',');
      if(l4==='Tài,Tài,Xỉu,Xỉu') return {prediction:'Tài',reason:'[Theo] 2T2X'};
      if(l4==='Xỉu,Xỉu,Tài,Tài') return {prediction:'Xỉu',reason:'[Theo] 2X2T'};
    }
    if(history.length>=7){
      const l7=history.slice(-7).map(h=>h.result);
      if(l7.every(r=>r==='Xỉu')) return {prediction:'Tài',reason:'[Bẻ] 7 Xỉu'};
      if(l7.every(r=>r==='Tài')) return {prediction:'Xỉu',reason:'[Bẻ] 7 Tài'};
    }
    const avg=Stat.mean(rs);
    if(avg>11) return {prediction:'Tài',reason:`[AI] Điểm cao`};
    if(avg<7) return {prediction:'Xỉu',reason:`[AI] Điểm thấp`};
    if(tc>xc+1) return {prediction:'Xỉu',reason:`[Bẻ] Tài đa số`};
    if(xc>tc+1) return {prediction:'Tài',reason:`[Bẻ] Xỉu đa số`};
    const oT=history.filter(h=>h.result==='Tài').length, oX=history.filter(h=>h.result==='Xỉu').length;
    if(oT>oX) return {prediction:'Xỉu',reason:'[Bẻ] Tổng Tài nhiều'};
    return {prediction:'Tài',reason:'[Theo] Tổng Xỉu nhiều'};
  }
};

const SunAlgo = {
  markovChain(seq,order){
    if(seq.length<=order) return null;
    const current=seq.slice(-order).join('');
    let tv=0,xv=0;
    for(let i=0;i<=seq.length-order-1;i++){
      const w=seq.slice(i,i+order).join('');
      if(w===current){ const nx=seq[i+order]; if(nx==='Tài') tv++; else if(nx==='Xỉu') xv++; }
    }
    const tot=tv+xv;
    if(!tot) return null;
    return {predict:tv>xv?'Tài':'Xỉu', confidence:Math.max(tv,xv)/tot};
  },
  patternMatching(seq){
    let longest=0,predict=null,conf=0;
    const maxLen=Math.floor(seq.length/2);
    for(let len=maxLen;len>=3;len--){
      const target=seq.slice(-len).join('');
      const search=seq.slice(0,seq.length-1).join('');
      const li=search.lastIndexOf(target);
      if(li!==-1){
        const before=search.substring(0,li);
        const arr=before.match(/Tài|Xỉu/g);
        const idx=(arr?arr.length:0)+len;
        if(seq[idx]){ predict=seq[idx]; longest=len; conf=Math.min(1,0.8+len*0.05); break; }
      }
    }
    if(!predict) return null;
    return {predict,confidence:conf,longestLen:longest};
  },
  bayesianPredict(seq){
    const r3=seq.slice(-3);
    let cT=0,cX=0;
    seq.forEach(k=>k==='Tài'?cT++:cX++);
    if(!cT||!cX) return null;
    const pT=cT/seq.length,pX=cX/seq.length;
    let cRT=0.1,cRX=0.1;
    for(let i=3;i<seq.length;i++){
      if(seq[i-3]===r3[0] && seq[i-2]===r3[1] && seq[i-1]===r3[2]){
        if(seq[i]==='Tài') cRT++; else cRX++;
      }
    }
    const lT=cRT/cT, lX=cRX/cX;
    const uT=pT*lT, uX=pX*lX;
    if(!uT && !uX) return null;
    return {predict:uT>uX?'Tài':'Xỉu',confidence:Math.max(uT,uX)/(uT+uX)};
  },
  hiddenStateAnalysis(seq){
    const r10=seq.slice(-10);
    let f=0;
    for(let i=1;i<r10.length;i++) if(r10[i]!==r10[i-1]) f++;
    const last=seq[seq.length-1];
    if(f>=6) return {predict:last==='Tài'?'Xỉu':'Tài',confidence:f/10,type:'Choppy'};
    if(f<=3) return {predict:last,confidence:(10-f)/10,type:'Trending'};
    return null;
  }
};

const PyAlgo = {
  markovPy(seq,order=3){
    if(seq.length<=order) return null;
    const tr={};
    for(let i=0;i<=seq.length-order-1;i++){
      const st=seq.slice(i,i+order).join('|'), nx=seq[i+order];
      if(!tr[st]) tr[st]={Tài:0,Xỉu:0};
      tr[st][nx]++;
    }
    const ctx=seq.slice(-order).join('|');
    if(!tr[ctx]) return null;
    const {Tài:t,Xỉu:x}=tr[ctx];
    return {predict:t>x?'Tài':'Xỉu',confidence:Math.max(t,x)/(t+x)};
  },
  patternPy(seq,maxLen=5){
    const len=Math.min(maxLen,seq.length);
    for(let l=len;l>=1;l--){
      const pat=seq.slice(-l); const matches=[];
      for(let i=0;i<=seq.length-l-1;i++){
        let ok=true;
        for(let j=0;j<l;j++) if(seq[i+j]!==pat[j]){ok=false;break;}
        if(ok) matches.push(seq[i+l]);
      }
      if(matches.length){
        const cnt={Tài:0,Xỉu:0};
        matches.forEach(m=>cnt[m]++);
        return {predict:cnt.Tài>cnt.Xỉu?'Tài':'Xỉu',confidence:Math.max(cnt.Tài,cnt.Xỉu)/matches.length};
      }
    }
    return null;
  },
  bayesPy(seq){
    const c0=seq.filter(v=>v==='Xỉu').length+1, c1=seq.filter(v=>v==='Tài').length+1;
    const p1=c1/(c0+c1);
    return {predict:p1>0.5?'Tài':'Xỉu',confidence:Math.max(p1,1-p1)};
  },
  hmmPy(seq){
    if(seq.length<5) return null;
    const rec=seq.slice(-8);
    let f=0;
    for(let i=1;i<rec.length;i++) if(rec[i]!==rec[i-1]) f++;
    const trend=f<=3;
    let tT=0,tX=0,cT=0,cX=0;
    for(let i=8;i<seq.length;i++){
      const w=seq.slice(i-8,i);
      let ff=0;
      for(let j=1;j<w.length;j++) if(w[j]!==w[j-1]) ff++;
      const isTr=ff<=3;
      if(isTr){ if(seq[i]==='Tài') tT++; else tX++; }
      else { if(seq[i]==='Tài') cT++; else cX++; }
    }
    const pred=trend?(tT>tX?'Tài':'Xỉu'):(cT>cX?'Tài':'Xỉu');
    const conf=trend?Math.max(tT,tX)/(tT+tX||1):Math.max(cT,cX)/(cT+cX||1);
    return {predict:pred,confidence:Math.max(0.5,conf)};
  },
  lstmPy(seq,lookback=5){
    if(seq.length<lookback+5) return null;
    const X=[],y=[];
    for(let i=lookback;i<seq.length;i++){
      X.push(seq.slice(i-lookback,i).map(v=>v==='Tài'?1:0));
      y.push(seq[i]==='Tài'?1:0);
    }
    if(X.length<5) return null;
    const w=new Array(lookback).fill(0); let b=0; const lr=0.15;
    for(let ep=0;ep<120;ep++){
      for(let i=0;i<X.length;i++){
        let z=b;
        for(let j=0;j<lookback;j++) z+=w[j]*X[i][j];
        const p=1/(1+Math.exp(-z));
        const err=y[i]-p;
        for(let j=0;j<lookback;j++) w[j]+=lr*err*X[i][j];
        b+=lr*err;
      }
    }
    const last=seq.slice(-lookback).map(v=>v==='Tài'?1:0);
    let z=b;
    for(let j=0;j<lookback;j++) z+=w[j]*last[j];
    const p=1/(1+Math.exp(-z));
    return {predict:p>0.5?'Tài':'Xỉu',confidence:Math.max(p,1-p)};
  }
};

const BinhAlgo = {
  miniAI(h){
    if(h.length<2) return {prediction:null,confidence:0};
    const l=h[h.length-1],p=h[h.length-2];
    const dir=l.result!==p.result?'flip':'same';
    const pred=dir==='flip'?(l.result==='Tài'?'Xỉu':'Tài'):l.result;
    const sc=Math.abs((l.totalScore||0)-(p.totalScore||0));
    const conf=Math.min(0.85,0.4+sc*0.03);
    return {prediction:pred,confidence:conf};
  },
  statisticalEngine(h){
    const pts=h.map(x=>x.totalScore||0);
    const stats={mean:Stat.mean(pts),variance:Stat.variance(pts),std:Stat.std(pts),
      skewness:Stat.skewness(pts),kurtosis:Stat.kurtosis(pts)};
    const rec=h.slice(-10);
    const tC=rec.filter(x=>x.result==='Tài').length;
    let pred='Tài';
    if(stats.mean>11) pred='Xỉu';
    else if(stats.mean<8) pred='Tài';
    else { if(tC>6) pred='Xỉu'; else if(tC<4) pred='Tài';
           else pred=h[h.length-1].result==='Tài'?'Xỉu':'Tài'; }
    const conf=Math.min(0.9,0.5+Math.abs(stats.mean-10.5)*0.05+Math.abs(stats.skewness)*0.1);
    return {prediction:pred,confidence:conf,stats};
  },
  mainAI(h){
    const stat=BinhAlgo.statisticalEngine(h);
    const trend=Mrtinh.trendAndProb(h);
    const bridge=Mrtinh.smartBridgeBreak(h);
    const v={Tài:0,Xỉu:0};
    v[stat.prediction]+=0.4*stat.confidence;
    if(trend===1) v.Tài+=0.3; else if(trend===2) v.Xỉu+=0.3;
    if(bridge.prediction===1) v.Tài+=0.3*bridge.breakProb;
    else if(bridge.prediction===2) v.Xỉu+=0.3*bridge.breakProb;
    const pred=v.Tài>=v.Xỉu?'Tài':'Xỉu';
    const conf=Math.max(v.Tài,v.Xỉu)/(v.Tài+v.Xỉu+0.001);
    return {prediction:pred,confidence:conf};
  },
  advancedAI(h){
    if(h.length<10) return {prediction:null,confidence:0};
    const pts=h.map(x=>x.totalScore||0);
    const rec=pts.slice(-6);
    const avg=Stat.mean(rec);
    const last=rec[rec.length-1];
    const dev=last-avg;
    let pred;
    if(last>14) pred='Xỉu';
    else if(last<6) pred='Tài';
    else if(dev>3) pred='Xỉu';
    else if(dev<-3) pred='Tài';
    else pred=h[h.length-1].result==='Tài'?'Xỉu':'Tài';
    const conf=Math.min(0.85,0.45+Math.abs(dev)*0.06);
    return {prediction:pred,confidence:conf};
  }
};

const VipAlgo = {
  analyze(h){
    if(h.length<10) return {prediction:null,confidence:0};
    const pts=h.map(x=>x.totalScore||0);
    const sma5=Stat.mean(pts.slice(-5));
    const sma10=Stat.mean(pts.slice(-10));
    const mom=Stat.mean(pts.slice(-3))-Stat.mean(pts.slice(-6,-3));
    const sig=[];
    if(sma5>sma10 && mom>0) sig.push({type:'LONG_TREND',strength:0.8});
    if(sma5<sma10 && mom<0) sig.push({type:'SHORT_TREND',strength:0.8});
    const g=[],l=[];
    for(let i=1;i<Math.min(15,pts.length);i++){
      const d=pts[pts.length-i]-pts[pts.length-i-1];
      if(d>0) g.push(d); else l.push(-d);
    }
    const ag=Stat.mean(g)||0, al=Stat.mean(l)||0;
    const rs=ag/(al||0.001);
    const rsi=100-100/(1+rs);
    if(rsi<30) sig.push({type:'LONG_REVERSAL',strength:0.7});
    if(rsi>70) sig.push({type:'SHORT_REVERSAL',strength:0.7});
    if(!sig.length) return {prediction:null,confidence:0};
    sig.sort((a,b)=>b.strength-a.strength);
    const best=sig[0];
    return {prediction:best.type.includes('LONG')?'Tài':'Xỉu', confidence:best.strength, signal:best.type};
  }
};

 * DEEP ENGINE — TỔNG HỢP V2 với FIXED WEIGHTS
 * ==================================================================*/
const DeepEngine = {
  predict(history) {
    if (!history || history.length < 8) {
      return this.fallbackResult();
    }

    // TẦNG 1: FEATURES
    const features = Features.extract(history);

    // TẦNG 2: PATTERN
    const patternRes = PatternEngine.predict(features.seq);

    // TẦNG 3: REGIME
    const regime = RegimeDetector.detect(features);

    // TẦNG 4: ENSEMBLE với FIXED WEIGHTS
    const allVotes = [];
    const addVote = (modelId, name, predict, baseWeight, confidence) => {
      if (!predict) return;
      // Regime boost (không dùng performance)
      let regimeBoost = 1;
      if (regime.regime === 'trending') {
        if (modelId.includes('trend') || modelId.includes('markov') || modelId.includes('hmm'))
          regimeBoost = 1.25;
        if (modelId.includes('reversal') || modelId.includes('mean'))
          regimeBoost = 0.85;
      } else if (regime.regime === 'choppy') {
        if (modelId.includes('trend') || modelId.includes('markov'))
          regimeBoost = 0.8;
        if (modelId.includes('bayes') || modelId.includes('mean') || modelId.includes('switch'))
          regimeBoost = 1.25;
      }
      const finalScore = baseWeight * confidence * regimeBoost;
      allVotes.push({
        modelId, name, predict, weight: baseWeight,
        confidence, regimeBoost, score: finalScore,
        engine: modelId.split('_')[0],
      });
    };

    // Pattern AI (cao nhất)
    if (patternRes.prediction) {
      const active = patternRes.active;
      addVote('pattern_ai', `🎯 Pattern AI (${active.name})`,
        patternRes.prediction,
        3.2 + (patternRes.urgency||0) * 2,
        patternRes.confidence);
    }

    // mrtinh
    const trend = Mrtinh.trendAndProb(history);
    addVote('mrtinh_trend', 'Trend & Prob', trend===1?'Tài':trend===2?'Xỉu':null, 1.0, 0.72);
    const short = Mrtinh.shortPattern(history);
    addVote('mrtinh_short', 'Short Pattern', short===1?'Tài':short===2?'Xỉu':null, 0.9, 0.7);
    const mean = Mrtinh.meanDeviation(history);
    addVote('mrtinh_mean', 'Mean Deviation', mean===1?'Tài':mean===2?'Xỉu':null, 0.85, 0.68);
    const sw = Mrtinh.recentSwitch(history);
    addVote('mrtinh_switch', 'Recent Switch', sw===1?'Tài':sw===2?'Xỉu':null, 0.8, 0.65);
    const bridge = Mrtinh.smartBridgeBreak(history);
    addVote('mrtinh_bridge', 'Smart Bridge', bridge.prediction===1?'Tài':bridge.prediction===2?'Xỉu':null, 1.35, bridge.breakProb);
    const aiHt = Mrtinh.aiHtddLogic(history);
    addVote('mrtinh_htdd', 'AI HTDD', aiHt.prediction, 1.1, 0.75);

    // sun
    for (let i = 2; i <= 5; i++) {
      const mk = SunAlgo.markovChain(features.seq, i);
      if (mk) addVote(`sun_markov_${i}`, `Markov B${i} (sun)`, mk.predict, i*1.5, mk.confidence);
    }
    const pm = SunAlgo.patternMatching(features.seq);
    if (pm) addVote('sun_pattern', `Pattern Sun (L=${pm.longestLen})`, pm.predict, 4.0, pm.confidence);
    const bp = SunAlgo.bayesianPredict(features.seq);
    if (bp) addVote('sun_bayes', 'Naive Bayes (sun)', bp.predict, 2.0, bp.confidence);
    const hs = SunAlgo.hiddenStateAnalysis(features.seq);
    if (hs) addVote('sun_hmm', `HiddenState (${hs.type})`, hs.predict, 2.5, hs.confidence);

    // py
    const pyMk = PyAlgo.markovPy(features.seq, 3);
    if (pyMk) addVote('py_markov', 'Markov Py', pyMk.predict, 1.2, pyMk.confidence);
    const pyPat = PyAlgo.patternPy(features.seq, 4);
    if (pyPat) addVote('py_pattern', 'Pattern Py', pyPat.predict, 1.2, pyPat.confidence);
    const pyB = PyAlgo.bayesPy(features.seq);
    if (pyB) addVote('py_bayes', 'Bayes Py', pyB.predict, 0.8, pyB.confidence);
    const pyH = PyAlgo.hmmPy(features.seq);
    if (pyH) addVote('py_hmm', 'HMM Py', pyH.predict, 1.4, pyH.confidence);
    const pyL = PyAlgo.lstmPy(features.seq, 5);
    if (pyL) addVote('py_lstm', 'LSTM Py', pyL.predict, 1.7, pyL.confidence);

    // binh
    const mini = BinhAlgo.miniAI(history);
    if (mini.prediction) addVote('binh_mini', 'Mini AI', mini.prediction, 0.8, mini.confidence);
    const statE = BinhAlgo.statisticalEngine(history);
    addVote('binh_stat', 'Statistical', statE.prediction, 1.0, statE.confidence);
    const mainAI = BinhAlgo.mainAI(history);
    addVote('binh_main', 'Main AI', mainAI.prediction, 1.2, mainAI.confidence);
    const advAI = BinhAlgo.advancedAI(history);
    if (advAI.prediction) addVote('binh_adv', 'Advanced AI', advAI.prediction, 1.1, advAI.confidence);

    // vip
    const vipRes = VipAlgo.analyze(history);
    if (vipRes.prediction) addVote('vip_smart', 'Smart Trading', vipRes.prediction, 1.2, vipRes.confidence);

    // TỔNG HỢP
    let taiScore = 0, xiuScore = 0;
    allVotes.forEach(v => {
      if (v.predict === 'Tài') taiScore += v.score;
      else if (v.predict === 'Xỉu') xiuScore += v.score;
    });

    if (Mrtinh.isBadPattern(history)) { taiScore *= 0.92; xiuScore *= 0.92; }
    const last10 = features.seq.slice(-10);
    const tc10 = last10.filter(r=>r==='Tài').length;
    if (tc10 >= 8) xiuScore += 0.2;
    else if (tc10 <= 2) taiScore += 0.2;
    if (bridge.breakProb > 0.6) {
      if (bridge.prediction === 1) taiScore += 0.28;
      else xiuScore += 0.28;
    }

    let prediction = taiScore >= xiuScore ? 'Tài' : 'Xỉu';
    let confidence = Math.max(taiScore, xiuScore) / (taiScore + xiuScore + 0.001);

    // Ép buộc bẻ cầu
    const active = patternRes.active;
    if (active && active.willBreak && (active.urgency || 0) >= 0.18) {
      prediction = active.predictedNext;
      confidence = Math.min(0.97, confidence + 0.14);
    } else if (active && active.isUrgent && (active.urgency||0) >= 0.3) {
      if (prediction === active.predictedNext) confidence = Math.min(0.97, confidence + 0.08);
    }

    // TẦNG 5: TRAP
    const trap = TrapDetector.detect(features, patternRes);
    if (trap.isTrap) confidence *= (1 - trap.trapScore * 0.4);

    // Sức mạnh cầu
    const patternStrength = patternRes.strength || 0;

    // Votes by model
    const votesByModel = {};
    allVotes.forEach(v => { if (v.predict) votesByModel[v.modelId] = v.predict; });

    const reasons = [];
    reasons.push(`🎯 ${active ? active.name : 'Chưa rõ cầu'}`);
    if (active && active.isUrgent) reasons.push(`⚠️ Còn ~${active.endsIn}p → bẻ`);
    if (active && active.willBreak) reasons.push(`💥 ĐIỂM BẺ`);
    if (trap.isTrap) reasons.push(`⚠️ NGHI BẪY (${(trap.trapScore*100).toFixed(0)}%)`);
    reasons.push(`📊 ${taiScore.toFixed(2)} vs ${xiuScore.toFixed(2)}`);
    reasons.push(`🎛️ Regime: ${regime.label}`);

    return {
      prediction, confidence, votes: allVotes,
      reason: reasons.join(' • '),
      taiScore, xiuScore,
      patterns: patternRes.patterns,
      activePattern: active,
      urgency: patternRes.urgency,
      strength: patternStrength,
      regime,
      trap,
      features,
      votesByModel,
    };
  },

  fallbackResult() {
    const r = Math.random() < 0.5 ? 'Tài' : 'Xỉu';
    return {
      prediction: r, confidence: 0.5,
      votes: [{modelId:'fallback', name:'Random', predict:r, weight:1, confidence:0.5, score:0.5, engine:'system'}],
      reason: 'Không đủ dữ liệu (< 8 phiên)',
      patterns: [], activePattern: null, urgency: 0, strength: 0,
      regime: {regime:'transition', confidence:0, label:'—', scores:{}},
      trap: {isTrap:false, trapScore:0, traps:[]},
      taiScore: 0.5, xiuScore: 0.5,
      votesByModel: {},
    };
  }
};

const particles = [];
const PARTICLE_COUNT = 34;
const ORANGE_RGB = "255,149,0";
class Particle {
  constructor(iy) { this.reset(); if (iy !== undefined) this.y = iy; }
  reset() {
    this.x = Math.random()*canvas.width;
    this.y = -Math.random()*200-20;
    this.size = Math.random()*2+1.5;
    this.speed = Math.random()*2+1;
    this.opacity = Math.random()*0.4+0.6;
  }
  update() { this.y += this.speed; if (this.y > canvas.height) this.reset(); }
  draw() {
    ctx.fillStyle = `rgba(${ORANGE_RGB},${this.opacity})`;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 8; ctx.shadowColor = `rgba(${ORANGE_RGB},0.85)`;
  }
}
for(let i=0;i<PARTICLE_COUNT;i++) particles.push(new Particle(Math.random()*canvas.height));
function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(animate);
}
animate();

async function fetchAPI() {

  } catch(e) {

function processData(data) {
  if (!data || !Array.isArray(data.list) || !data.list.length) return;
  const rawList = data.list;
  const topId = rawList[0].id;

  const sessions = rawList.map(s => ({
    id: s.id,
    result: s.resultTruyenThong === 'TAI' ? 'Tài' : 'Xỉu',
    point: s.point,
    dices: s.dices || []
  }));

  const existingIds = new Set(state.sessions.map(s => s.id));
  for (const s of sessions) if (!existingIds.has(s.id)) state.sessions.push(s);
  state.sessions.sort((a,b)=>b.id - a.id);
  if (state.sessions.length > 300) state.sessions = state.sessions.slice(0, 300);

  if (state.pendingPrediction) {
    const target = state.sessions.find(s => s.id === state.pendingPrediction.forId);
    if (target && target.ourPrediction === undefined) {
      target.ourPrediction = state.pendingPrediction.prediction;
      target.correct = (target.result === state.pendingPrediction.prediction);
      target.predConfidence = state.pendingPrediction.confidence;
      showToast(
        target.correct
          ? `✅ Phiên #${target.id} ĐÚNG! (${target.ourPrediction})`
          : `❌ Phiên #${target.id} SAI! (dự ${target.ourPrediction} / KQ ${target.result})`
      );
      state.pendingPrediction = null;
    } else if (state.pendingPrediction.forId < topId) {
      const missed = state.sessions.find(s => s.id === state.pendingPrediction.forId);
      if (missed && missed.ourPrediction === undefined) {
        missed.ourPrediction = 'Không dự đoán';
        missed.correct = null;
        missed.predConfidence = 0;
      }
      state.pendingPrediction = null;
    }
  }

  if (state.lastTopId !== topId) {
    state.lastTopId = topId;
    const histOld = [...state.sessions]
      .filter(s => s.result === 'Tài' || s.result === 'Xỉu')
      .sort((a,b)=>a.id - b.id)
      .map(s => ({result: s.result, totalScore: s.point, session: s.id}));

    if (histOld.length >= 8) {
      const predResult = DeepEngine.predict(histOld);
      state.pendingPrediction = {
        forId: topId + 1,
        prediction: predResult.prediction,
        confidence: predResult.confidence,
        votes: predResult.votes,
        reason: predResult.reason,
        taiScore: predResult.taiScore,
        xiuScore: predResult.xiuScore,
        patterns: predResult.patterns,
        activePattern: predResult.activePattern,
        urgency: predResult.urgency,
        strength: predResult.strength,
        regime: predResult.regime,
        trap: predResult.trap,
        votesByModel: predResult.votesByModel,
        timestamp: Date.now()
      };
      console.log('[LC79-SV2] #' + (topId+1), '→', predResult.prediction,
        `(${(predResult.confidence*100).toFixed(1)}%)`,
        '| Cầu:', predResult.activePattern ? predResult.activePattern.name : 'N/A',
        '| Regime:', predResult.regime.label,
        '| Strength:', (predResult.strength*100).toFixed(0) + '%');
    } else {
      state.pendingPrediction = {
        forId: topId + 1,
        prediction: null, confidence: 0, votes: [],
        reason: 'Đang thu thập dữ liệu (cần ≥8 phiên)...',
        patterns: [], activePattern: null, urgency: 0, strength: 0,
        regime: {regime:'transition', confidence:0, label:'—', scores:{}},
        trap: {isTrap:false, trapScore:0, traps:[]},
        votesByModel: {},
        timestamp: Date.now()
      };
    }
  }

  render();
}

    if (active) {
      patternNameEl.textContent = `🎯 ${active.name}`;
      patternEndEl.classList.remove('urgent');
      if (active.type === 'cycle') {
        const endIn = active.endsIn !== undefined ? active.endsIn : 0;
        if (active.willBreak) {
          patternEndEl.textContent = '💥 BẺ NGAY';
          patternEndEl.classList.add('urgent');
        } else if (active.isUrgent) {
          patternEndEl.textContent = `⚠️ Còn ${endIn}p`;
          patternEndEl.classList.add('urgent');
        } else {
          patternEndEl.textContent = `Đổi ~${endIn}p`;
        }
      } else if (active.type === 'streak') {
        if (active.willBreak) { patternEndEl.textContent = '💥 BẺ NGAY'; patternEndEl.classList.add('urgent'); }
        else patternEndEl.textContent = `Bệt ${active.streakLength}`;
      } else {
        patternEndEl.textContent = `~${active.predictedBreakIn || '—'}p`;
      }
    } else {
      patternNameEl.textContent = '🎯 Đang nhận diện cầu...';
      patternEndEl.textContent = '— p';
      patternEndEl.classList.remove('urgent');
    }
  } else {
    ssEl.textContent = '---';
    resEl.textContent = 'LOADING';
    resEl.className = 'result-display text-wait';
    confTxtEl.textContent = '---'; confBarEl.style.width = '0%';
    strengthTxtEl.textContent = '---'; strengthBarEl.style.width = '0%';
    regimeTxtEl.textContent = '---'; regimeBarEl.style.width = '0%';
    regimeBadge.className = 'regime'; regimeBadge.textContent = 'ĐANG PHÂN TÍCH';
    patternNameEl.textContent = '🎯 Đang kết nối...';
    patternEndEl.textContent = '— p';
    patternEndEl.classList.remove('urgent');
  }
  renderHistory();
}

function renderHistory() {
  const listEl = document.getElementById('history-list');
  const html = [];
  const pp = state.pendingPrediction;

  if (pp && pp.forId) {
    const pClass = pp.prediction === 'Tài' ? 'b-tai' : (pp.prediction === 'Xỉu' ? 'b-xiu' : '');
    html.push(`<div class="hist-row pending">
      <div style="font-family:var(--font-num);color:var(--gold-bright)">#${pp.forId}</div>
      <div>${pClass ? `<span class="badge ${pClass}">${pp.prediction}</span>` : '<span style="color:#555">—</span>'}</div>
      <div><span style="color:#555">...</span></div>
      <div><span style="color:var(--gold-bright);font-weight:800;font-size:9px">⏳ ĐANG CHỜ</span></div>
    </div>`);
  }

  const hist = state.sessions.slice(0, 40);
  for (const s of hist) {
    const pClass = s.ourPrediction === 'Tài' ? 'b-tai' : (s.ourPrediction === 'Xỉu' ? 'b-xiu' : '');
    const rClass = s.result === 'Tài' ? 'b-tai' : 'b-xiu';
    let stt = '<span style="color:#555">-</span>';
    if (s.ourPrediction === 'Không dự đoán') stt = '<span style="color:#666;font-weight:700;font-size:9px">BỎ QUA</span>';
    else if (typeof s.correct === 'boolean') {
      stt = s.correct
        ? '<span style="color:var(--tai);font-weight:800"><i class="fas fa-check"></i> ĐÚNG</span>'
        : '<span style="color:var(--xiu);font-weight:800"><i class="fas fa-times"></i> SAI</span>';
    }
    html.push(`<div class="hist-row">
      <div style="font-family:var(--font-num);color:#999">#${s.id}</div>
      <div>${pClass ? `<span class="badge ${pClass}">${s.ourPrediction}</span>` : '<span style="color:#555">—</span>'}</div>
      <div><span class="badge ${rClass}">${s.result}</span></div>
      <div>${stt}</div>
    </div>`);
  }

  if (!html.length) html.push('<div style="text-align:center;padding:36px 12px;color:#666;font-size:12px">Chưa có dữ liệu phiên</div>');
  listEl.innerHTML = html.join('');
}

function showToast(msg) {
  const Toast = Swal.mixin({
    toast: true, position: 'top-end', showConfirmButton: false,
    timer: 2500, timerProgressBar: true,
    background: '#0a0600', color: '#FFB800',
    didOpen: (t) => { t.style.border = '1px solid rgba(255,149,0,0.45)'; t.style.borderRadius = '12px'; }
  });
  Toast.fire({ icon: msg.startsWith('✅') ? 'success' : 'error', title: msg });
}

async function poll() {
  try {
    const data = await fetchAPI();
    processData(data);
  } catch(err) {
    console.error('Poll err:', err);
    document.getElementById('main-result').textContent = 'LỖI';
    document.getElementById('main-result').className = 'result-display text-wait';
    document.getElementById('conf-txt').textContent = 'Mất kết nối';
    document.getElementById('conf-bar').style.width = '0%';
  }
}

setInterval(() => {
  document.getElementById('clock-now').innerText = new Date().toLocaleTimeString('vi-VN', {hour12:false});
}, 1000);

render();
poll();
pollTimer = setInterval(poll, POLL_INTERVAL);
window.addEventListener('beforeunload', () => {
  if (pollTimer) clearInterval(pollTimer);
  state = { sessions: [], pendingPrediction: null, lastTopId: 0 };
});
